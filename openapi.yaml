swagger: "2.0"

info:
  title: nio-bank-api
  version: 1.0.0

schemes:
  - https

paths:

  /users/save:
    post:
      operationId: createUser
      x-google-backend:
        address: https://spring-app-509070532587.asia-south1.run.app
      responses:
        "200":
          description: Success

  /users/{id}:
    get:
      operationId: getUserById

      parameters:
        - name: id
          in: path
          required: true
          type: integer
          description: User ID

      x-google-backend:
        address: https://spring-app-509070532587.asia-south1.run.app
        path_translation: APPEND_PATH_TO_ADDRESS

      responses:
        "200":
          description: Successful response
        "400":
          description: Bad request
        "404":
          description: User not found